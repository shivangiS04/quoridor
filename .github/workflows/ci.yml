name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kotlin:
    name: Kotlin unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Provide placeholder local.properties
        run: |
          {
            echo "SUPABASE_URL=https://example.supabase.co"
            echo "SUPABASE_ANON_KEY=ci-placeholder"
          } > local.properties
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-test-reports
          path: app/build/reports/tests/

  deno:
    name: Deno tests (edge functions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno fmt --check supabase/functions/_shared/quoridor_test.ts
      - run: deno check supabase/functions/*/index.ts
      - run: deno test supabase/functions

  db:
    name: Database tests (migrations, RLS, triggers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: supabase/tests/package-lock.json
      - run: npm ci
        working-directory: supabase/tests
      - run: npm test
        working-directory: supabase/tests
